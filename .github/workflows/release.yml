name: Release

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for GitVersion
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'
      
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml
      
      - name: Display Version Info
        run: |
          echo "Version: ${{ steps.gitversion.outputs.nuGetVersion }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Is Tag: ${{ startsWith(github.ref, 'refs/tags/') }}"
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: |
          dotnet build \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.gitversion.outputs.nuGetVersion }} \
            -p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
            -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} \
            -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }} \
            -p:ContinuousIntegrationBuild=true
      
      - name: Test
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --verbosity normal
      
      - name: Pack
        run: |
          dotnet pack \
            --configuration Release \
            --no-build \
            --output ./artifacts/packages \
            -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
      
      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/packages/*.nupkg
          retention-days: 90
      
      # Publish pre-release to GitHub Packages on develop branch
      - name: Publish to GitHub Packages (Pre-release)
        if: github.ref == 'refs/heads/develop'
        run: |
          dotnet nuget push "./artifacts/packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Publish stable release to NuGet.org on tagged versions
      - name: Publish to NuGet.org (Stable Release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push "./artifacts/packages/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      
      # Create GitHub Release for tagged versions
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.gitversion.outputs.semVer }}
          draft: false
          prerelease: ${{ contains(steps.gitversion.outputs.nuGetVersion, '-') }}
          generate_release_notes: true
          files: |
            ./artifacts/packages/*.nupkg
            ./artifacts/packages/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release Summary
        if: always()
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.gitversion.outputs.nuGetVersion }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "- **Published to**: GitHub Packages (pre-release)" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "- **Published to**: NuGet.org (stable release)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Published to**: Artifacts only" >> $GITHUB_STEP_SUMMARY
          fi
